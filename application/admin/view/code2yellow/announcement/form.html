<form id="announcement-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">标题</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[title]" value="{$row.title|htmlentities}" maxlength="120" data-rule="required"></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">正文</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="row[content]" rows="8" maxlength="10000" data-rule="required">{$row.content|htmlentities}</textarea><span class="help-block">纯文本，支持换行。</span></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">状态</label><div class="col-xs-12 col-sm-8"><select class="form-control" name="row[status]"><option value="draft" {if $row.status == 'draft'}selected{/if}>草稿</option><option value="published" {if $row.status == 'published'}selected{/if}>发布</option><option value="disabled" {if $row.status == 'disabled'}selected{/if}>停用</option></select></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">适用模式</label><div class="col-xs-12 col-sm-8"><select class="form-control" name="row[mode]"><option value="all" {if $row.mode == 'all'}selected{/if}>全部</option><option value="green" {if $row.mode == 'green'}selected{/if}>绿区</option><option value="yellow" {if $row.mode == 'yellow'}selected{/if}>黄区</option></select></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">版本范围</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[min_version]" placeholder="最低版本，如 3.0.2，留空不限制" value="{$row.min_version|htmlentities}"><input class="form-control" name="row[max_version]" placeholder="最高版本，留空不限制" value="{$row.max_version|htmlentities}"></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">展示时间</label><div class="col-xs-12 col-sm-8"><input type="datetime-local" class="form-control" name="row[start_at]" value="{$row.start_at|htmlentities}"><input type="datetime-local" class="form-control" name="row[end_at]" value="{$row.end_at|htmlentities}"><span class="help-block">按服务器时间填写，留空表示不限制。</span></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">显示方式</label><div class="col-xs-12 col-sm-8"><label><input type="checkbox" name="row[is_pinned]" value="1" {if $row.is_pinned}checked{/if}> 置顶</label>　<label><input type="checkbox" name="row[is_urgent]" value="1" {if $row.is_urgent}checked{/if}> 紧急公告（首次显示时弹出）</label>{if $editing}<br><label><input type="checkbox" name="row[renotify]" value="1"> 修改后重新提示已读用户</label>{/if}</div></div>
    <div class="form-group layer-footer"><div class="col-xs-12 col-sm-offset-2 col-sm-8"><button type="button" class="btn btn-info btn-preview">预览</button> <button type="submit" class="btn btn-primary btn-embossed disabled">保存</button></div></div>
</form>
